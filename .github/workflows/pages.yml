# Publica o editor no GitHub Pages.
#
# As actions estão nos majores que rodam em node24: o runner avisa de
# obsolescência quando a action declara node20 internamente, e isso não tem
# relação com o node-version do setup-node abaixo, que é o Node do build.
#
# O léxico de rimas não está no repositório: são 10 MB gerados a partir de
# fontes públicas (ver NOTICE.md). Este workflow baixa o corretor ortográfico e
# a lista de frequência e roda o gerador, que é o passo que faz a busca de
# rimas existir no site publicado. O acervo de poesia já está no repositório,
# em packages/lexicon/data. As fontes baixadas ficam em cache entre execuções —
# o corretor está preso a um commit, e a lista de frequência não muda.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uma publicação por vez, e sem cancelar a que já está a meio caminho.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # O que impede publicar quebrado. Vale mais aqui do que em qualquer
      # outro lugar: no Pages não há como voltar atrás sem outra publicação.
      - name: verificar
        run: |
          npm run typecheck
          npm test

      - name: listas de palavras em cache
        id: listas
        uses: actions/cache@v6
        with:
          path: .cache/listas
          key: listas-pt-br-v2

      - name: baixar as listas
        if: steps.listas.outputs.cache-hit != 'true'
        env:
          # VERO, o pt_BR do LibreOffice, preso a um commit: o léxico não muda
          # sozinho quando o dicionário muda.
          VERO: https://raw.githubusercontent.com/LibreOffice/dictionaries/5cf23af85b47be6e398add826da1a02175be4238/pt_BR
        run: |
          mkdir -p .cache/listas
          curl -fsSL --retry 3 -o .cache/listas/pt_BR.dic "$VERO/pt_BR.dic"
          curl -fsSL --retry 3 -o .cache/listas/pt_BR.aff "$VERO/pt_BR.aff"
          curl -fsSL --retry 3 \
            -o .cache/listas/frequencias.txt \
            https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/pt_br/pt_br_full.txt

      - name: gerar o léxico
        run: |
          # O corretor expandido tem dez milhões de formas; cabe com folga nos
          # 7 GB do runner, não no heap padrão do Node.
          node --max-old-space-size=6000 packages/lexicon/scripts/build.mjs \
            .cache/listas/frequencias.txt \
            .cache/listas/pt_BR.dic \
            .cache/listas/pt_BR.aff \
            apps/editor/public/lexico

      # O Wiktionary em português, na extração do wiktextract, para o índice de
      # sentidos (ferramenta de duplo sentido). O kaikki.org não versiona o
      # arquivo; o cache o segura estável entre publicações.
      - name: Wiktionary em cache
        id: wikt
        uses: actions/cache@v6
        with:
          path: .cache/wikt
          key: wiktionary-pt-v1

      - name: baixar o Wiktionary
        if: steps.wikt.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/wikt
          curl -fsSL --retry 3 -o .cache/wikt/pt.jsonl.gz \
            https://kaikki.org/ptwiktionary/raw-wiktextract-data.jsonl.gz

      - name: gerar o índice de sentidos
        run: |
          node --max-old-space-size=6000 packages/lexicon/scripts/sentidos.mjs \
            .cache/wikt/pt.jsonl.gz \
            apps/editor/public/lexico

      - name: montar o site
        # Pages de projeto serve em /<repo>/; o `base` sai daqui.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build -w @escandir/editor

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
